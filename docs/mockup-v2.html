<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maqueta de pantallas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --page: #efe8da; --page-text: #3a332b; --page-muted: #7a7062;
  --cream: #fbf6ec; --card: #ffffff; --ink: #2b2620; --muted: #6f665b; --line: #ece3d3;
  --leaf: #2f7d4a; --leaf-d: #1f5a34; --leaf-l: #e3f1e6;
  --sun: #f2b33d; --sun-l: #fdf0d2; --soil: #8a5a36; --soil-l: #f3e6d9; --terra: #c8643b; --sky: #d6ebf5;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --page: #1b1814; --page-text: #efe8da; --page-muted: #a89e8f; }
}
:root[data-theme="dark"] { --page: #1b1814; --page-text: #efe8da; --page-muted: #a89e8f; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--page-text); font: 16px/1.45 Nunito, system-ui, sans-serif; }
.intro { max-width: 900px; margin: 0 auto; padding: 32px 16px 8px; text-align: center; }
.intro h1 { font: 700 30px/1.15 Fraunces, Georgia, serif; margin: 0 0 6px; }
.intro p { margin: 0; color: var(--page-muted); }
.gallery { display: flex; flex-wrap: wrap; justify-content: center; gap: 36px 28px; padding: 28px 16px 48px; max-width: 1600px; margin: 0 auto; }
figure { margin: 0; display: grid; gap: 12px; justify-items: center; }
figcaption { text-align: center; max-width: 320px; font-size: 14px; color: var(--page-muted); }
figcaption b { display: block; color: var(--page-text); font-size: 15px; }

/* ---------- phone ---------- */
.phone { width: min(340px, calc(100vw - 32px)); height: 720px; border-radius: 44px; background: #161412; padding: 10px;
  box-shadow: 0 24px 60px rgba(40, 30, 15, .25); }
.screen { position: relative; height: 100%; border-radius: 34px; overflow: hidden; background: var(--cream); color: var(--ink);
  display: flex; flex-direction: column; }
.status { display: flex; justify-content: space-between; padding: 12px 24px 4px; font-size: 12.5px; font-weight: 700; }
.body { flex: 1; padding: 8px 20px 20px; display: flex; flex-direction: column; gap: 12px; overflow: hidden; }
.topbar { display: flex; align-items: center; gap: 10px; font-weight: 700; color: var(--muted); font-size: 14px; }
.back { width: 34px; height: 34px; border-radius: 50%; background: var(--card); display: grid; place-items: center; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.dots { margin-left: auto; display: flex; gap: 5px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--leaf); width: 18px; border-radius: 4px; }
h2 { font: 700 26px/1.15 Fraunces, Georgia, serif; margin: 0; letter-spacing: -.01em; }
h3 { font: 600 19px/1.2 Fraunces, Georgia, serif; margin: 0; }
.lead { color: var(--muted); margin: 0; font-size: 15.5px; }
.btn { display: block; width: 100%; border: 0; border-radius: 18px; padding: 16px; font: 800 17px Nunito, sans-serif; text-align: center; cursor: pointer; }
.btn.go { background: var(--leaf); color: #fff; box-shadow: 0 6px 16px rgba(47, 125, 74, .35); }
.btn.soft { background: var(--card); color: var(--leaf-d); border: 2px solid var(--line); }
.spacer { flex: 1; }
.tag { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--leaf); }
.small { font-size: 13px; color: var(--muted); }

/* screen 1 */
.hero { height: 330px; flex: none; }
.welcome .body { padding-top: 18px; }
.brand { display: flex; align-items: center; gap: 8px; font: 700 15px Fraunces, serif; color: var(--leaf-d); }

/* screen 2 */
.map { position: relative; height: 300px; border-radius: 24px; overflow: hidden; flex: none; box-shadow: inset 0 0 0 1px rgba(0,0,0,.06); }
.map-chip { position: absolute; left: 12px; bottom: 12px; background: #fff; border-radius: 14px; padding: 8px 12px; font-weight: 800; font-size: 14px; box-shadow: 0 4px 12px rgba(0,0,0,.18); }
.map-chip span { display: block; font-weight: 600; font-size: 12px; color: var(--muted); }
.locate { display: flex; align-items: center; gap: 10px; background: var(--sky); color: #1d4f6b; border-radius: 16px; padding: 12px 14px; font-weight: 800; }

/* screen 3 */
.q { font-weight: 800; font-size: 15px; margin: 2px 0 -4px; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tile { background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 10px 6px 10px; text-align: center; font-weight: 700; font-size: 13.5px; position: relative; }
.tile svg { width: 54px; height: 54px; display: block; margin: 0 auto 4px; }
.tile.on { border-color: var(--leaf); background: var(--leaf-l); }
.tile.on::after { content: "✓"; position: absolute; top: 6px; right: 8px; width: 20px; height: 20px; border-radius: 50%; background: var(--leaf); color: #fff; font-size: 12px; line-height: 20px; }

/* screen 4 */
.loader { display: grid; place-items: center; height: 250px; flex: none; }
.checks { display: grid; gap: 10px; }
.check { display: flex; align-items: center; gap: 12px; background: var(--card); border-radius: 16px; padding: 12px 14px; font-weight: 700; font-size: 14.5px; }
.check .ic { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; flex: none; color: #fff; font-size: 14px; background: var(--leaf); }
.check.wait { color: var(--muted); }
.check.wait .ic { background: var(--line); color: var(--muted); }

/* screen 5 */
.result-top { background: linear-gradient(180deg, var(--leaf-l), var(--cream)); margin: -8px -20px 0; padding: 8px 20px 0; }
.crop-hero { display: flex; align-items: center; gap: 14px; }
.crop-hero .circle { width: 72px; height: 72px; border-radius: 50%; background: #fff; display: grid; place-items: center; flex: none; box-shadow: 0 4px 14px rgba(47,125,74,.18); }
.money { background: var(--leaf); color: #fff; border-radius: 22px; padding: 14px 16px; }
.money .big { font: 700 32px/1 Fraunces, serif; white-space: nowrap; }
.money .big small { font: 700 15px Nunito, sans-serif; opacity: .9; }
.money p { margin: 6px 0 0; font-size: 14px; opacity: .92; }
.facts { display: grid; gap: 8px; }
.fact { display: flex; gap: 12px; align-items: center; background: var(--card); border-radius: 16px; padding: 8px 12px; font-size: 13.5px; line-height: 1.3; }
.fact b { display: block; font-size: 14.5px; }
.fact .ic { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; flex: none; }

/* screen 6 */
.opt { display: flex; gap: 12px; align-items: center; background: var(--card); border: 2px solid var(--line); border-radius: 20px; padding: 6px 12px 6px 6px; }
.opt.best { border-color: var(--leaf); }
.opt .pic { width: 48px; height: 48px; border-radius: 16px; display: grid; place-items: center; flex: none; }
.opt .pic svg { width: 40px; height: 40px; }
.opt .name { font-weight: 800; font-size: 15.5px; }
.opt .chip { display: inline-block; font-size: 11.5px; font-weight: 800; border-radius: 999px; padding: 1px 8px; margin-top: 2px; }
.opt .val { margin-left: auto; text-align: right; font: 700 18px Fraunces, serif; white-space: nowrap; }
.opt .val small { display: block; font: 600 11px Nunito, sans-serif; color: var(--muted); }
.up { color: var(--leaf); } .down { color: var(--terra); }

/* screen 7 */
.winters { display: grid; grid-template-columns: repeat(9, 1fr); gap: 4px; background: var(--card); border-radius: 20px; padding: 12px 10px 10px; }
.winters span { aspect-ratio: 1; display: grid; place-items: center; border-radius: 8px; background: var(--leaf-l); }
.winters span.miss { background: var(--soil-l); }
.winters svg { width: 70%; height: 70%; }
.yrs { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); padding: 0 4px; margin-top: -8px; }
.legend { display: flex; gap: 14px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }
.total { background: var(--sun-l); border-radius: 18px; padding: 12px 14px; font-size: 14.5px; }
.total b { font: 700 22px Fraunces, serif; display: block; color: var(--ink); }

/* screen 8 */
.why { display: flex; gap: 12px; background: var(--card); border-radius: 18px; padding: 12px; }
.why .pic { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; flex: none; }
.why b { display: block; font-size: 15px; }
.why p { margin: 2px 0 0; font-size: 13.5px; color: var(--muted); }
.why .src { display: inline-block; margin-top: 4px; font-size: 11px; font-weight: 800; color: #1d4f6b; background: var(--sky); border-radius: 6px; padding: 0 6px; }
.unknown { border: 2px dashed var(--line); border-radius: 18px; padding: 10px 14px; font-size: 13.5px; color: var(--muted); }
.unknown b { color: var(--ink); }
</style>
</head>

<header class="intro">
  <h1>Maqueta: “Gana plata en invierno”</h1>
  <p>El recorrido del productor, pantalla por pantalla. Números reales del motor (Santa Cruz, −17.40, −63.20).</p>
</header>

<main class="gallery">

  <!-- 1. Bienvenida -->
  <figure>
    <div class="phone"><div class="screen welcome">
      <svg class="hero" viewBox="0 0 320 330" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfe6f2"/><stop offset="1" stop-color="#fbf6ec"/></linearGradient></defs>
        <rect width="320" height="330" fill="url(#sky)"/>
        <circle cx="250" cy="78" r="34" fill="#f2b33d"/><circle cx="250" cy="78" r="48" fill="#f2b33d" opacity=".18"/>
        <path d="M0 190c60-40 130-46 200-26s90 10 120-6v172H0z" fill="#8fc27f"/>
        <path d="M0 220c80-30 170-28 320-4v114H0z" fill="#b98557"/>
        <g stroke="#8a5a36" stroke-width="3" opacity=".55"><path d="M-20 330L120 222"/><path d="M40 330L150 220"/><path d="M110 330L180 220"/><path d="M180 330L210 221"/><path d="M250 330L240 224"/><path d="M320 330L270 226"/></g>
        <g transform="translate(70 240) scale(.55)"><use href="#sprout" width="24" height="24"/></g>
        <g transform="translate(150 262) scale(.8)"><use href="#sprout" width="24" height="24"/></g>
        <g transform="translate(225 246) scale(.6)"><use href="#sprout" width="24" height="24"/></g>
        <g transform="translate(100 290) scale(1)"><use href="#sprout" width="24" height="24"/></g>
        <g transform="translate(250 288) scale(1.1)"><use href="#sprout" width="24" height="24"/></g>
      </svg>
      <div class="body">
        <div class="brand"><svg width="20" height="20"><use href="#leaf"/></svg>[Nombre]</div>
        <h2>Tu campo puede ganar plata en invierno</h2>
        <p class="lead">Después de la soya, la tierra queda desnuda casi todo el año. Te mostramos qué habría pasado si sembrabas algo en invierno — en tu propio campo, en los últimos 45 años.</p>
        <div class="spacer"></div>
        <button class="btn go">Ver mi campo</button>
      </div>
    </div></div>
    <figcaption><b>1 · Bienvenida</b>Una promesa clara y un solo botón. Nada de formularios todavía.</figcaption>
  </figure>

  <!-- 4. Calculando -->
  <figure>
    <div class="phone"><div class="screen">
      <div class="status"><span>9:41</span><span>●●● 100%</span></div>
      <div class="body">
        <div class="loader">
          <svg width="220" height="220" viewBox="0 0 220 220" aria-hidden="true">
